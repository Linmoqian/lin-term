[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lin-term"
version = "0.1.0"
description = "Python 终端语义语言：业务代码描述事件，模块赋予视觉语义"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["rich>=13"]

[tool.setuptools]
packages = ["lin_term"]